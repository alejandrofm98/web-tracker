services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3002"
    ports:
      - "127.0.0.1:3002:3002"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.webtracker.rule=Host(`web-tracker.walerike.com`)"
      - "traefik.http.routers.webtracker.entrypoints=websecure"
      - "traefik.http.routers.webtracker.service=webtracker"
      - "traefik.http.routers.webtracker.tls=true"
      - "traefik.http.routers.webtracker.tls.certresolver=letsencrypt"
      - "traefik.http.services.webtracker.loadbalancer.server.port=3002"
      - "traefik.http.routers.webtracker-http.rule=Host(`web-tracker.walerike.com`)"
      - "traefik.http.routers.webtracker-http.entrypoints=web"
      - "traefik.http.routers.webtracker-http.service=webtracker"
      - "traefik.http.routers.webtracker-http.middlewares=webtracker-https"
      - "traefik.http.middlewares.webtracker-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.webtracker-https.redirectscheme.permanent=true"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura la URL interna de PostgreSQL de Dokploy}
      ADMIN_USER: ${ADMIN_USER:?Configura ADMIN_USER en Dokploy}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en Dokploy}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET en Dokploy}
      API_TOKEN: ${API_TOKEN:?Configura API_TOKEN en Dokploy}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TZ: Europe/Madrid
      PORT: "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - default
      - dokploy-network

networks:
  default: {}
  dokploy-network:
    external: true
